name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.25.x'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  ACTIONLINT_VERSION: 'v1.7.7'

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Format
        run: |
          unformatted=$(git ls-files '*.go' | while IFS= read -r file; do gofmt -l "$file"; done)
          test -z "$unformatted"
      - name: Build
        run: go build -o "$RUNNER_TEMP/sessionbus-status" .
      - name: Test
        run: go test -timeout 600s ./...
      - name: Race test
        run: go test -race -timeout 900s ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          golangci-lint run ./...

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Shellcheck
        run: shellcheck scripts/package scripts/archive-install scripts/install.sh scripts/install_test.sh
      - name: Installer test
        run: sh scripts/install_test.sh

  workflow-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - run: actionlint
